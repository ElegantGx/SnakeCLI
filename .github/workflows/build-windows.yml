name: Build Windows (Cygwin)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cygwin toolchain
        uses: cygwin/cygwin-install-action@v6
        with:
          packages: gcc-core libncurses-devel ncurses terminfo terminfo-extra zip

      - name: Build
        shell: D:\cygwin\bin\bash.exe --noprofile --norc -eo pipefail -o igncr {0}
        run: |
          cd "$(cygpath "$GITHUB_WORKSPACE")"
          gcc -std=gnu2x -O2 -Wall \
              -o SnakeCLI.exe game.c utils.c menu.c play.c main.c \
              -lncurses
          strip SnakeCLI.exe

      - name: Bundle runtime DLLs
        shell: D:\cygwin\bin\bash.exe --noprofile --norc -eo pipefail -o igncr {0}
        run: |
          cd "$(cygpath "$GITHUB_WORKSPACE")"
          DIST=SnakeCLI-windows-x86_64
          mkdir -p "$DIST/bin"
          cp SnakeCLI.exe "$DIST/bin/"
          cp LICENSE "$DIST/"
          ldd SnakeCLI.exe | grep -oE '/[^ ]+\.dll' | while read -r dll; do
              cp "$dll" "$DIST/bin/"
          done
          mkdir -p "$DIST/usr/share"
          cp -rL /usr/share/terminfo "$DIST/usr/share/"
          ls -l "$DIST/bin"

      - name: Zip package
        shell: D:\cygwin\bin\bash.exe --noprofile --norc -eo pipefail -o igncr {0}
        run: |
          cd "$(cygpath "$GITHUB_WORKSPACE")"
          zip -qr SnakeCLI-windows-x86_64.zip SnakeCLI-windows-x86_64

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: SnakeCLI-windows-x86_64
          path: SnakeCLI-windows-x86_64.zip
