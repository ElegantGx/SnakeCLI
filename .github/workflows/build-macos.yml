name: Build macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -B build
          cmake --build build
          strip build/snakecli -o snakecli-macOS-arm64
          otool -L snakecli-macOS-arm64

      # 在 runner（与用户相同的 macOS arm64）上直接验证产物可执行
      - name: Verify binary
        run: |
          set -euo pipefail
          file snakecli-macOS-arm64
          codesign --verify --verbose snakecli-macOS-arm64
          otool -l snakecli-macOS-arm64 | grep -A3 LC_BUILD_VERSION
          ./snakecli-macOS-arm64 --version | grep SnakeCLI
          ./snakecli-macOS-arm64 --help | grep Usage
          # pty 冒烟：启动 -> 菜单渲染 -> 方向键导航 -> Exit 正常退出
          python3 - "$PWD/snakecli-macOS-arm64" <<'PYEOF'
          import os, pty, sys, time, select, fcntl, termios, struct, signal

          BIN = sys.argv[1]
          pid, fd = pty.fork()
          if pid == 0:
              fcntl.ioctl(0, termios.TIOCSWINSZ, struct.pack("HHHH", 40, 100, 0, 0))
              os.environ["TERM"] = "xterm-256color"
              os.execv(BIN, [BIN])

          buf = b""
          deadline = time.time() + 15
          while time.time() < deadline and b"About" not in buf:
              r, _, _ = select.select([fd], [], [], 0.2)
              if r:
                  try:
                      buf += os.read(fd, 65536)
                  except OSError:
                      break
          if b"About" not in buf:
              print("FAIL: menu did not render")
              os.kill(pid, signal.SIGKILL)
              sys.exit(1)

          # 菜单顺序 Play -> About -> Exit，右右回车即退出
          # 注意应用模式(smkx)下方向键序列是 \EOC 而非 \E[C
          os.write(fd, b"\x1bOC\x1bOC\n")
          deadline = time.time() + 10
          while True:
              wpid, status = os.waitpid(pid, os.WNOHANG)
              if wpid == pid:
                  break
              if time.time() > deadline:
                  print("FAIL: game did not exit")
                  os.kill(pid, signal.SIGKILL)
                  sys.exit(1)
              time.sleep(0.2)
          if not (os.WIFEXITED(status) and os.WEXITSTATUS(status) == 0):
              print(f"FAIL: bad exit status {status}")
              sys.exit(1)
          print("smoke test PASS")
          PYEOF

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: snakecli-macOS
          path: snakecli-macOS-arm64
