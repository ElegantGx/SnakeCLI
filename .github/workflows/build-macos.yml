name: Build macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -B build
          cmake --build build
          strip build/snakecli -o snakecli-macOS-arm64
          otool -L snakecli-macOS-arm64

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: snakecli-macOS
          path: snakecli-macOS-arm64
