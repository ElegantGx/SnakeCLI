name: Build macOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '上传到的 Release tag（留空则只传 artifact）'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -B build
          cmake --build build
          strip build/snakecli -o snakecli-macOS-arm64
          codesign --force --sign - snakecli-macOS-arm64
          codesign --verify --verbose snakecli-macOS-arm64
          otool -L snakecli-macOS-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: snakecli-macOS
          path: snakecli-macOS-arm64

      - name: Upload to Release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.release_tag }}" snakecli-macOS-arm64 --clobber
